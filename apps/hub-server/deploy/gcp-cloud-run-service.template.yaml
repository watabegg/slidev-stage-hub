apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: replace-hub-service
  namespace: 'REPLACE_PROJECT_NUMBER'
  labels:
    cloud.googleapis.com/location: REPLACE_REGION
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: REPLACE_SERVICE_ACCOUNT@REPLACE_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: REPLACE_REGION-docker.pkg.dev/REPLACE_PROJECT_ID/REPLACE_REPOSITORY/hub:REPLACE_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: HUB_STATIC_DIR
              value: /app/static
            - name: HUB_STORAGE
              value: gcs
            - name: HUB_BUCKET
              value: REPLACE_EXISTING_GCS_BUCKET
            - name: GOOGLE_CLOUD_PROJECT
              value: REPLACE_PROJECT_ID
            - name: HUB_PUBLICATIONS
              value: postgres
            - name: HUB_DATABASE_INIT
              value: 'false'
            - name: HUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_DATABASE_URL_SECRET
                  key: 'REPLACE_DATABASE_URL_SECRET_VERSION'
            - name: HUB_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REPLACE_PUBLISH_TOKEN_SECRET
                  key: 'REPLACE_PUBLISH_TOKEN_SECRET_VERSION'
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
  traffic:
    - latestRevision: true
      percent: 100
