packages:
  - examples/slidev52
  - apps/*
  - packages/*
allowBuilds:
  playwright-chromium: false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261006.1-alpha
  - wrangler@4.149.0
  - slidev-theme-watabegg@1.2.1
  - '@aws-sdk/checksums@3.1001.2'
  - '@aws-sdk/client-s3@3.1149.0'
  - '@aws-sdk/core@3.978.2'
  - '@aws-sdk/credential-provider-env@3.972.73'
  - '@aws-sdk/credential-provider-http@3.972.75'
  - '@aws-sdk/credential-provider-ini@3.973.18'
  - '@aws-sdk/credential-provider-login@3.972.80'
  - '@aws-sdk/credential-provider-node@3.972.85'
  - '@aws-sdk/credential-provider-process@3.972.73'
  - '@aws-sdk/credential-provider-sso@3.973.17'
  - '@aws-sdk/credential-provider-web-identity@3.972.79'
  - '@aws-sdk/middleware-sdk-s3@3.972.78'
  - '@aws-sdk/nested-clients@3.997.47'
  - '@aws-sdk/signature-v4-multi-region@3.996.48'
  - '@aws-sdk/token-providers@3.1149.0'
  - '@cloudflare/workers-types@5.20261010.1'
# Preserve the toolchain used by the migrated Slidev 53 adapter.
overrides:
  '@slidev/cli@53.0.0>vite': 8.3.2
  postcss: 8.5.28
  # Comark imports Markdown-it 14's private token module.
  markdown-it: 14.3.2
  # Shiki's Twoslash adapter expects the pre-5.4 VMenu component shape.
  floating-vue: 5.2.2
  # Standalone UnoCSS builds emitted duplicate edits with the 1.4.3 resolution.
  # Preserve the working 1.x editor; leave the separate 0.30.x consumers intact.
  'magic-string@>=1.0.0 <2.0.0': 1.4.2
