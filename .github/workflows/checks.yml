name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUB_TEST_DATABASE_URL: postgres://hub:local-test-only@127.0.0.1:5432/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm verify:portable
      - run: pnpm verify:packed-cli
      - run: pnpm verify:packed-server
      - run: pnpm verify:server
      - run: pnpm verify:publication-jobs
  rust-core:
    needs: portable
    env:
      CARGO_BUILD_JOBS: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path apps/slive/Cargo.toml -p slive-core -p slive
  native:
    needs: rust-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      NO_AT_BRIDGE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop SDK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
          pnpm exec playwright install --with-deps chromium
      - run: pnpm build:slidock:fixtures
      - name: Workers and static Slive native regression
        run: xvfb-run -a dbus-run-session -- sh -c 'pnpm verify:workers-slive && pnpm verify:slive'
